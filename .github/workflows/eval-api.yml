name: Eval API Tests

on:
  push:
    branches: ["**"]
    paths:
      - "eval-api/**"
      - ".github/workflows/eval-api.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "eval-api/**"
      - ".github/workflows/eval-api.yml"

jobs:
  maven:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: eval-api/pom.xml

      - name: Run tests
        run: sh ./mvnw -B test
