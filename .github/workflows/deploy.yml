name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Check deploy secrets
        id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST and EC2_SSH_KEY are not set. The image was built and pushed; the server deploy was skipped."
          elif ! timeout 15 bash -c "exec 3<>/dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The server at EC2_HOST is not reachable on port 22 (instance stopped, or the IP changed). The image was built and pushed; the server deploy was skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EC2
        if: steps.check.outputs.enabled == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key.pem
          printf '%s\n' "$EC2_SSH_KEY" > key.pem
          REMOTE="IFS= read -r REGISTRY_TOKEN; export REGISTRY_TOKEN; export IMAGE='${IMAGE}:${SHA}' REGISTRY_USER='${ACTOR}'; exec bash -s"
          { printf '%s\n' "$GHCR_TOKEN"; cat deploy/remote_deploy.sh; } \
            | ssh -i key.pem -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
                "${EC2_USER}@${EC2_HOST}" "$REMOTE"
          rm -f key.pem
